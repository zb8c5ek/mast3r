[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mast3r"
version = "1.0.0"
description = "MASt3R: Grounding Image Matching in 3D"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["mast3r*", "MOD_FeatureProcess*", "MOD_ResultsAnalyze*"]
